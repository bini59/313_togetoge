# Production is the togetoge namespace on the Oracle k3s, deployed by Flux from bini59/homelab (apps/togetoge).
# This workflow only pushes ghcr.io/bini59/313_togetoge:sha-<commit>-<unix time>; Flux rolls out the newest tag.
name: Build togetoge image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: togetoge-production
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=ghcr.io/bini59/313_togetoge:sha-$GITHUB_SHA-$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
