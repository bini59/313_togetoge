# Legacy k3s image publishing, retained for an operator-controlled rollback.
# Publishing an image can trigger Flux. Never run automatically during the Workers cutover.
name: Build legacy togetoge image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Legacy commit with Dockerfile to publish (can trigger Flux rollout)'
        required: true
        default: 'b8c1154e89b612a8ec5dd8b930e5301a972b885a'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: togetoge-production
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: tag
        run: echo "tag=ghcr.io/bini59/313_togetoge:sha-${{ steps.source.outputs.sha }}-$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
